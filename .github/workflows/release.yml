name: Release
on:
  push: { branches: [main] }
concurrency: { group: release, cancel-in-progress: false }
permissions: {}
jobs:
  select:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs: { mode: '${{ steps.select.outputs.mode }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: select
        uses: changesets/action/select-mode@v2
  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: changesets/action/version@v2
  publish:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: npm
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck && npm test
      - uses: changesets/action/publish@v2
        with: { script: npm run release }
        env: { NPM_CONFIG_PROVENANCE: 'true' }
